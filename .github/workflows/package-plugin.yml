name: Package PlaneToPBR Plugin

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      target-platforms:
        description: Unreal target platforms passed to BuildPlugin.
        required: true
        default: Win64
      ue-engine-dir:
        description: Unreal Engine directory on the runner.
        required: true
        default: C:\Program Files\Epic Games\UE_5.7
      publish-release:
        description: Publish Artifacts/PlaneToPBR.zip to a GitHub release (run this workflow on a tag).
        required: true
        type: boolean
        default: false
      prerelease:
        description: Mark the GitHub release as a prerelease.
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package-plugin:
    runs-on: [self-hosted, windows]
    env:
      UE_ENGINE_DIR: ${{ inputs.ue-engine-dir || vars.UE_ENGINE_DIR || 'C:\Program Files\Epic Games\UE_5.7' }}
      PLUGIN_TARGET_PLATFORMS: ${{ inputs.target-platforms || vars.PLUGIN_TARGET_PLATFORMS || 'Win64' }}
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: '*'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run automation tests
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./Build/RunPlaneToPBRAutomationTests.ps1

      - name: Package plugin
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./Build/PackagePlaneToPBRPlugin.ps1

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaneToPBR-plugin
          path: Artifacts/PlaneToPBR.zip
          if-no-files-found: error

      - name: Resolve release settings
        id: release
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $shouldPublish = "${{ github.ref_type }}" -eq "tag" -or "${{ inputs.publish-release }}" -eq "true"
          if ($shouldPublish -and "${{ github.ref_type }}" -ne "tag") {
            throw "Publishing requires a tag ref. Select a tag when running this workflow manually, or push a new v* tag."
          }

          $tagName = "${{ github.ref_name }}"
          if ($shouldPublish -and [string]::IsNullOrWhiteSpace($tagName)) {
            throw "The workflow tag ref has no tag name."
          }

          $isPrerelease = "${{ inputs.prerelease }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $isPrerelease = "true"
          }

          "should-publish=$($shouldPublish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tag-name=$tagName" >> $env:GITHUB_OUTPUT
          "is-prerelease=$($isPrerelease.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        if: steps.release.outputs.should-publish == 'true'
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagName = "${{ steps.release.outputs.tag-name }}"
          $notes = @"
          Initial beta release of the PlaneToPBR Unreal plugin.

          ## Download
          Download PlaneToPBR.zip, extract it, and copy the PlaneToPBR plugin folder into your Unreal project's Plugins directory.

          ## Includes
          - PlaneToPBR editor tab
          - Managed Hugging Face generation integration
          - Generated texture import
          - Material creation
          - Displaced plane mesh/actor creation

          ## Validation
          - Packaged by GitHub Actions from commit $env:GITHUB_SHA
          - Built for target platforms: $env:PLUGIN_TARGET_PLATFORMS
          "@

          $releaseArgs = @(
            "release", "create", $tagName,
            "Artifacts/PlaneToPBR.zip",
            "--target", $env:GITHUB_SHA,
            "--title", "PlaneToPBR $tagName",
            "--notes", $notes
          )

          if ("${{ steps.release.outputs.is-prerelease }}" -eq "true") {
            $releaseArgs += "--prerelease"
          }

          gh @releaseArgs
