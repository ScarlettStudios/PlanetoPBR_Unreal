name: Package PlaneToPBR Plugin

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target-platforms:
        description: Unreal target platforms passed to BuildPlugin.
        required: true
        default: Linux
      ue-engine-dir:
        description: Unreal Engine directory inside the runner or container.
        required: true
        default: /opt/unreal-engine

jobs:
  package-plugin:
    runs-on: [self-hosted, linux]
    env:
      UE_ENGINE_DIR: ${{ inputs.ue-engine-dir || vars.UE_ENGINE_DIR || '/opt/unreal-engine' }}
      PLUGIN_TARGET_PLATFORMS: ${{ inputs.target-platforms || vars.PLUGIN_TARGET_PLATFORMS || 'Linux' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build packaging image
        run: docker build -t planetopbr-plugin-packager:${{ github.sha }} .

      - name: Package plugin
        run: |
          docker run --rm \
            -e UE_ENGINE_DIR="${UE_ENGINE_DIR}" \
            -e PLUGIN_TARGET_PLATFORMS="${PLUGIN_TARGET_PLATFORMS}" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${UE_ENGINE_DIR}:${UE_ENGINE_DIR}:ro" \
            planetopbr-plugin-packager:${{ github.sha }}

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaneToPBR-plugin
          path: Artifacts/PlaneToPBR.zip
          if-no-files-found: error
